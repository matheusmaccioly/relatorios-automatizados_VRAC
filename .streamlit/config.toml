# Gerado por scripts/sync-branding.py a partir de assets/branding/tokens.toml.
[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
headless = true
fileWatcherType = "auto"
enableStaticServing = true

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#000000"
backgroundColor = "#F5F5F0"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#000000"
borderColor = "#CDCAC1"
dataframeBorderColor = "#CDCAC1"
dataframeHeaderBackgroundColor = "#000000"
dataframeHeaderTextColor = "#FFFFFF"
linkColor = "#000000"
font = "Rethink Sans"
headingFont = "Rethink Sans"
headingFontWeights = [700, 700, 700, 700, 700, 700]
chartCategoricalColors = ["#0081AD", "#E08C07", "#7817B1", "#00A2AC", "#BF6000"]
baseRadius = "small"
paddingTop = "2rem"
paddingBottom = "3rem"
showWidgetBorder = true
showSidebarBorder = true
redColor = "#BE002D"
redBackgroundColor = "#FFFFFF"
redTextColor = "#000000"
orangeColor = "#BF6000"
orangeBackgroundColor = "#FFFFFF"
orangeTextColor = "#000000"
yellowColor = "#FFB52F"
yellowBackgroundColor = "#FFFFFF"
yellowTextColor = "#000000"
blueColor = "#0081AD"
blueBackgroundColor = "#FFFFFF"
blueTextColor = "#000000"
greenColor = "#00A2AC"
greenBackgroundColor = "#FFFFFF"
greenTextColor = "#000000"
violetColor = "#7817B1"
violetBackgroundColor = "#FFFFFF"
violetTextColor = "#000000"
grayColor = "#869597"
grayBackgroundColor = "#FFFFFF"
grayTextColor = "#000000"

[[theme.fontFaces]]
family = "Rethink Sans"
url = "app/static/branding/RethinkSans-Regular.ttf"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Rethink Sans"
url = "app/static/branding/RethinkSans-SemiBold.ttf"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "Rethink Sans"
url = "app/static/branding/RethinkSans-Bold.ttf"
weight = "700"
style = "normal"

[[theme.fontFaces]]
family = "Literata"
url = "app/static/branding/Literata-Regular.ttf"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Literata"
url = "app/static/branding/Literata-SemiBold.ttf"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "Literata"
url = "app/static/branding/Literata-Bold.ttf"
weight = "700"
style = "normal"

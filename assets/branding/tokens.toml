# Fonte única do tema. Gerar config e cópias web com scripts/sync-branding.py.
[reference]
institution = "PUC-Rio"
status = "applied_pending_review"
source_document = "logos/RGB/puc-rio_códigosadotados_brasões_23-10-10 RGB.pdf"
source_version = "EMoD | PUC-RIO_Assinaturas RGB · 23-10-18"
provided_on = "2026-10-28"
reviewed_by = ""
reviewed_on = ""

[colors]
# Azul e ciano: prancha EMoD 23-10-18. Azul também é a primeira série dos gráficos.
blue = "#0081AD"
cyan = "#00B7DD"
# Neutros presentes nas assinaturas monocromáticas e no fundo do material.
black = "#000000"
white = "#FFFFFF"
# D-032: Matheus indicou o site público e o portal como referência mais próxima do
# design system. Valores abaixo vêm de https://www.puc-rio.br/styles/index_puc_tapume.css
# (famílias amarelo1/2/3, roxo2, turquesa2, vermelho2 e offwhite); substitui o amarelo
# da D-021 na interface e nas exportações. Revisão institucional pendente (Q-012).
yellow = "#FFB52F"
yellow_deep = "#E08C07"
yellow_dark = "#BF6000"
purple = "#7817B1"
turquoise = "#00A2AC"
red = "#BE002D"
ink = "#1F1F1F"
line = "#CDCAC1"
background = "#F5F5F0"
# Valores do portal fornecido por Matheus, sem correspondente no CSS público.
ink_soft = "#333333"
surface_hover = "#EBEBE4"
yellow_soft = "#FFF1D2"
# Cinza hex impresso da prancha (D-021); usado somente no tema do Streamlit.
gray = "#869597"

[charts]
# Ordem fixa de séries, atribuída pela entidade e nunca pelo ranking. Verificada com
# validador de paleta: luminosidade, croma, daltonismo e distância entre vizinhas.
# #E08C07 fica abaixo de 3:1 sobre branco; por isso legenda e tabela são obrigatórias.
series = ["#0081AD", "#E08C07", "#7817B1", "#00A2AC", "#BF6000"]

[typography]
body_family = "Rethink Sans"
heading_family = "Rethink Sans"
editorial_family = "Literata"
application_status = "proposed_pending_review"

[marks]
primary_logo = "logos/RGB/PNG/_puc_rio-H_mono_abr_rgb_23-10-18.png"
logo_alt = "PUC-Rio"
# Sem recorte ou nova composição. Largura de layout, não tamanho mínimo oficial.
display_width = 132

[[fonts]]
family = "Rethink Sans"
file = "fonts/Rethink Sans/RethinkSans-Regular.ttf"
weight = "400"
style = "normal"

[[fonts]]
family = "Rethink Sans"
file = "fonts/Rethink Sans/RethinkSans-SemiBold.ttf"
weight = "600"
style = "normal"

[[fonts]]
family = "Rethink Sans"
file = "fonts/Rethink Sans/RethinkSans-Bold.ttf"
weight = "700"
style = "normal"

[[fonts]]
family = "Literata"
file = "fonts/Literata/Literata-Regular.ttf"
weight = "400"
style = "normal"

[[fonts]]
family = "Literata"
file = "fonts/Literata/Literata-SemiBold.ttf"
weight = "600"
style = "normal"

[[fonts]]
family = "Literata"
file = "fonts/Literata/Literata-Bold.ttf"
weight = "700"
style = "normal"

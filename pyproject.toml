[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "vrac-analises"
version = "0.1.0"
description = "Fundação da PoC interna de análises acadêmicas da VRAC — demonstração sintética"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.66.1,<2",
    "pandas>=2.3,<4",
    "matplotlib>=3.10,<4",
    "altair>=6.3,<7",
    "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
sqlserver = ["SQLAlchemy>=2.0,<3", "pyodbc>=5.3,<6"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
vrac-db = "vrac.db.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "ruff>=0.17.2,<0.18"]

[tool.hatch.build.targets.wheel]
packages = ["src/vrac"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "vrac/sql"
"config/analyses.yaml" = "vrac/analyses/analyses.yaml"
"assets/branding/tokens.toml" = "vrac/branding_assets/tokens.toml"
"assets/branding/logos/RGB/PNG/_puc_rio-H_cor_abr_rgb_23-10-18.png" = "vrac/branding_assets/logos/RGB/PNG/_puc_rio-H_cor_abr_rgb_23-10-18.png"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: prova institucional somente pelo operador, fora da sessão do agente"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

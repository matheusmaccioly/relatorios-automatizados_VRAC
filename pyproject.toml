[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "vrac-analises"
version = "0.1.7"
description = "Fundação da PoC interna de análises acadêmicas da VRAC — demonstração sintética"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.66.1,<2",
    "pandas>=2.3,<4",
    "matplotlib>=3.10,<4",
    "altair>=6.3,<7",
    "PyYAML>=6.0.3,<7",
    "supabase==2.34.0",
    "reportlab>=4.4,<5",
]

[project.optional-dependencies]
sqlserver = ["SQLAlchemy>=2.0,<3", "pyodbc>=5.3,<6"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
vrac-db = "vrac.db.cli:main"

[dependency-groups]
dev = [
    "pypdf>=6,<7",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.2,<0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vrac"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "vrac/sql"
"config/analyses.yaml" = "vrac/analyses/analyses.yaml"
"config/supabase.public.toml" = "vrac/supabase.public.toml"
"assets/branding/tokens.toml" = "vrac/branding_assets/tokens.toml"
"assets/branding/logos/RGB/PNG/_puc_rio-H_mono_abr_rgb_23-10-18.png" = "vrac/branding_assets/logos/RGB/PNG/_puc_rio-H_mono_abr_rgb_23-10-18.png"
"assets/branding/fonts/Rethink Sans/RethinkSans-Regular.ttf" = "vrac/branding_assets/fonts/Rethink Sans/RethinkSans-Regular.ttf"
"assets/branding/fonts/Rethink Sans/RethinkSans-SemiBold.ttf" = "vrac/branding_assets/fonts/Rethink Sans/RethinkSans-SemiBold.ttf"
"assets/branding/fonts/Rethink Sans/RethinkSans-Bold.ttf" = "vrac/branding_assets/fonts/Rethink Sans/RethinkSans-Bold.ttf"
"assets/branding/fonts/Literata/Literata-Regular.ttf" = "vrac/branding_assets/fonts/Literata/Literata-Regular.ttf"
"assets/branding/fonts/Literata/Literata-SemiBold.ttf" = "vrac/branding_assets/fonts/Literata/Literata-SemiBold.ttf"
"assets/branding/fonts/Literata/Literata-Bold.ttf" = "vrac/branding_assets/fonts/Literata/Literata-Bold.ttf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: prova institucional somente pelo operador, fora da sessão do agente"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

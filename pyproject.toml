[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "vrac-analises"
version = "0.1.0"
description = "Fundação da PoC interna de análises acadêmicas da VRAC — demonstração sintética"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.66.1,<2",
    "pandas>=2.3,<4",
    "matplotlib>=3.10,<4",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "ruff>=0.17.2,<0.18"]

[tool.hatch.build.targets.wheel]
packages = ["src/vrac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: execução institucional explícita pelo desenvolvedor (não implementada)"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

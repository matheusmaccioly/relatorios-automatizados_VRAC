documentary_evidence:
- id: semantic_models_documentation_2026_10_27
  reference: docs/ANALISE_MODELOS_SEMANTICOS_VRAC.md (referência interna local, excluída do Git)
  kind: semantic_model_documentation
  summary: 'Documento detalhado fornecido por Matheus: modelos A (pessoal/docentes) e B (alunos) fundamentam
    as variantes acadêmicas. Modelo C (projetos/financeiro) fora do escopo. Contagens de metadados não
    são resultados acadêmicos.'
  detailed_document_available: true
  limitations:
  - Nomes e tipos pertencem ao modelo semântico; não comprovam objetos SQL, chaves únicas ou unidade de
    horas.
  - Power Query/M e conexões não inspecionados; nenhuma execução DAX, consulta real, conciliação ou teste
    de RLS foi realizado.
  - D-022 dispensa reaprovar fórmulas documentadas; decisões pending preservam o histórico institucional,
    sem bloquear os executores sintéticos de D-027/D-028.
  - Cardinalidade, filtros bidirecionais, relações inativas e tabelas calculadas exigem revisão por indicador.
  - Mapeamento detalhado local em config/semantic_model_sources.local.yaml; não é carregado pelo aplicativo
    nem incluído no pacote.
  - Documento interno e mapeamento local não têm publicação autorizada; não copiar literais pessoais ou
    permissões mascaradas.

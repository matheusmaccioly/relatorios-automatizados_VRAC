  filters:
  - Separar departamento do vínculo e da disciplina
  - R04 semestre único escolhido, quadro e categoria; alocações dos vínculos elegíveis preservam vagas zero/nulas
  formula: 'R04 soma valores conhecidos de Horas Reais da fonte dedicada por vínculo no semestre escolhido;
    contratada requer um único valor conhecido distinto. R01 conserva máximo semestre por vínculo.
    Diferença e razão somente com unidades compatíveis explicitamente simuladas; razão sem base zero.
    Planejamento permanece separado e nunca substitui Horas Reais. Unicidade/unidade institucionais pendentes.'
  exceptions:
  - Atuação interdepartamental depende de cobertura e autorização confirmadas.
  - Compartilhamento sem identificador/regra fica pendente, sem dedução ou rateio.
  - Turma com zero alunos gera conferência; não exclui horas do indicador oficial.
  - Classificação ausente não autoriza inferir TCC/monografia nem disciplina regular.
  - Arredondamento exige casas, modo e evidência de revisão acordados.
  - Medidas e caminhos de filtro documentados exigem revisão e conciliação; a inspeção estática não avaliou
    DAX nem RLS por usuário.
  - As duas tabelas de planejamento do modelo A são distintas; há relacionamento muitos-para-muitos bidirecional
    com horários.
  - Objetos homônimos nos modelos A e B não comprovam fonte compartilhada nem autorização de junção.
  - Vagas por turma calculadas sem semestre na chave podem duplicar ou colapsar períodos; não transportar
    essa agregação.
  period_definition: Referência temporal oficial e unidade por medida; extração e atualização separadas

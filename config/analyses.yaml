  formula: 'R06 reproduz B-M-035 (MT/MC no histórico com limite de ingresso do cadastro), B-M-038
    (bolsa existente no mesmo período entre matriculados), B-M-036 (FR/TD do cadastro no menor período
    por matrícula) e B-M-070 (ingresso no ponto com período igual ou Dupla Diplomacao). Matrículas
    distintas, não pessoas únicas. Variação de matriculados = atual menos anterior; percentual só com
    base conhecida não zero. Ausência não vira zero; sem equivalência automática de cursos.'
  exceptions:
  - Não confundir registros de matrícula com alunos únicos.
  - Semelhança de nomes não comprova equivalência entre cursos nem programa/curso.
  - Mudança no meio do período exige recorte ou confirmação, sem fusão silenciosa.
  - Base zero torna o percentual não calculável; períodos ausentes ou parciais são sinalizados.
  - A contagem de colunas, relacionamentos ou medidas do modelo não determina alunos, matrículas ou cursos.
  - Revisar cardinalidade, filtros e tabelas calculadas no documento detalhado antes de adotar uma medida
    DAX como definição da série.
  - Medidas gerais vinculadas ao calendário de bolsas não são base padrão da série; não herdar cobertura
    de bolsas ou conversão de ausência para zero.
  - Mapas de programa e exceções de transferência não comprovam equivalências de cursos.
  - Trancamento, formação e transferência não serão classificados automaticamente como evasão.
  period_definition: Série de períodos explícitos e comparáveis; vigência das equivalências cobre todo
    o recorte utilizado.
  owner_role: Talita e responsável pelas matrículas/cursos
  rule_version: enrollment-draft-v3
  comparison_policy: Contagens exatas no mesmo recorte; base zero nunca recebe percentual numérico.

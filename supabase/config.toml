# Somente propriedades solicitadas: config push preserva as demais configurações remotas.
project_id = "relatorios-automatizados_VRAC"

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
jwt_expiry = 900

[auth.email]
enabled = true
enable_confirmations = true
